name: Edu radar safety and catalog pipeline tests

on:
  push:
    branches:
      - main
      - feat/p1-catalog-pipeline
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify Python syntax
        run: |
          for f in \
            safe_publish.py \
            catalog_metadata.py \
            official_verify.py \
            snapshot_validate.py \
            snapshot_enrich.py \
            scrape_snapshot.py \
            migrate_catalog_v2.py; do
            python -m py_compile "skills/dingyi-edu-radar/scripts/$f"
          done
      - name: Verify shell syntax
        run: bash -n skills/dingyi-edu-radar/scripts/refresh.sh
