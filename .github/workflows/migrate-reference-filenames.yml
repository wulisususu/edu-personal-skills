name: One-time portable reference migration

on:
  push:
    branches:
      - feat/p1-catalog-pipeline

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Migrate bootstrap reference filenames
        run: python skills/dingyi-edu-radar/scripts/migrate_reference_filenames.py

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills/dingyi-edu-radar/catalog.json skills/dingyi-edu-radar/references
          git commit -m "data: migrate references to portable filenames"
          git push origin HEAD:feat/p1-catalog-pipeline
